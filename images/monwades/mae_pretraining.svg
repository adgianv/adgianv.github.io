<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="380" rx="18" fill="#f7f8fa"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/>
    </marker>
    <pattern id="sat" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#c9d2dc"/>
      <rect x="3" y="4" width="16" height="12" fill="#e9edf2"/>
      <rect x="22" y="6" width="13" height="9" fill="#b2bfcd"/>
      <rect x="5" y="22" width="11" height="14" fill="#a9b6c4"/>
      <rect x="20" y="21" width="17" height="15" fill="#dde3ea"/>
    </pattern>
  </defs>

  <text x="60" y="66" font-size="13" font-weight="600" letter-spacing="2" fill="#7b8794">UNLABELLED TILE</text>
  <rect x="60" y="80" width="200" height="200" rx="8" fill="url(#sat)"/>

  <path d="M272 180 L322 180" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a3)"/>

  <text x="330" y="66" font-size="13" font-weight="600" letter-spacing="2" fill="#7b8794">75% OF PATCHES HIDDEN</text>
  <rect x="330" y="80" width="200" height="200" rx="8" fill="url(#sat)"/>
  <g fill="#3e4c59">
    <rect x="330" y="80" width="40" height="40"/><rect x="370" y="80" width="40" height="40"/><rect x="450" y="80" width="40" height="40"/><rect x="490" y="80" width="40" height="40"/>
    <rect x="330" y="120" width="40" height="40"/><rect x="410" y="120" width="40" height="40"/><rect x="450" y="120" width="40" height="40"/>
    <rect x="370" y="160" width="40" height="40"/><rect x="410" y="160" width="40" height="40"/><rect x="490" y="160" width="40" height="40"/>
    <rect x="330" y="200" width="40" height="40"/><rect x="370" y="200" width="40" height="40"/><rect x="450" y="200" width="40" height="40"/><rect x="490" y="200" width="40" height="40"/>
    <rect x="330" y="240" width="40" height="40"/><rect x="410" y="240" width="40" height="40"/><rect x="450" y="240" width="40" height="40"/><rect x="490" y="240" width="40" height="40"/>
    <rect x="410" y="80" width="40" height="40"/>
  </g>

  <path d="M542 180 L592 180" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="596" y="130" width="170" height="100" rx="14" fill="#fff" stroke="#7c5cd6" stroke-width="2"/>
  <text x="681" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Encoder</text>
  <text x="681" y="198" text-anchor="middle" font-size="13.5" fill="#52606d">sees visible patches</text>
  <path d="M772 180 L812 180" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="816" y="130" width="130" height="100" rx="14" fill="#fff" stroke="#d9dee4"/>
  <text x="881" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">Decoder</text>
  <text x="881" y="198" text-anchor="middle" font-size="13.5" fill="#52606d">fills the gaps</text>
  <path d="M952 180 L978 180" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a3)"/>

  <text x="982" y="66" font-size="13" font-weight="600" letter-spacing="2" fill="#7b8794">RECONSTRUCTION</text>
  <rect x="982" y="80" width="200" height="200" rx="8" fill="url(#sat)" opacity="0.8"/>
  <rect x="982" y="80" width="200" height="200" rx="8" fill="none" stroke="#7c5cd6" stroke-width="2" stroke-dasharray="6 5"/>

  <text x="60" y="334" font-size="14" fill="#7b8794">Learning to rebuild hidden patches adapts an ImageNet-pretrained ViT to overhead imagery without any damage labels. The encoder is then reused in the siamese model.</text>
</svg>
