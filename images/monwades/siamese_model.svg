<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="480" rx="18" fill="#f7f8fa"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/>
    </marker>
    <pattern id="tileA" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#cfd8e3"/>
      <rect x="2" y="3" width="9" height="7" fill="#e8edf3"/>
      <rect x="12" y="11" width="6" height="7" fill="#b6c2d1"/>
    </pattern>
    <pattern id="tileB" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#b9aea3"/>
      <rect x="2" y="3" width="9" height="7" fill="#d6cdc3"/>
      <rect x="12" y="11" width="6" height="7" fill="#8f8379"/>
    </pattern>
  </defs>

  <!-- inputs -->
  <text x="60" y="70" font-size="13" font-weight="600" letter-spacing="2" fill="#7b8794">BEFORE</text>
  <rect x="60" y="82" width="120" height="120" rx="8" fill="url(#tileA)" stroke="#9aa5b1"/>
  <text x="60" y="290" font-size="13" font-weight="600" letter-spacing="2" fill="#7b8794">AFTER</text>
  <rect x="60" y="302" width="120" height="120" rx="8" fill="url(#tileB)" stroke="#9aa5b1"/>
  <text x="120" y="226" text-anchor="middle" font-size="13" fill="#7b8794">same 224 × 224 tile</text>

  <path d="M186 142 L246 142" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M186 362 L246 362" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>

  <!-- encoders -->
  <rect x="250" y="92" width="210" height="100" rx="14" fill="#fff" stroke="#7c5cd6" stroke-width="2"/>
  <text x="355" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">ViT encoder</text>
  <text x="355" y="160" text-anchor="middle" font-size="13.5" fill="#52606d">MAE-pretrained</text>
  <rect x="250" y="312" width="210" height="100" rx="14" fill="#fff" stroke="#7c5cd6" stroke-width="2"/>
  <text x="355" y="355" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2933">ViT encoder</text>
  <text x="355" y="380" text-anchor="middle" font-size="13.5" fill="#52606d">MAE-pretrained</text>
  <path d="M355 198 L355 306" stroke="#7c5cd6" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="300" y="236" width="110" height="32" rx="16" fill="#efeafc"/>
  <text x="355" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#7c5cd6">shared weights</text>

  <path d="M466 142 L526 142" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M466 362 L526 362" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>

  <!-- patch embeddings -->
  <g fill="#e4e7eb" stroke="#fff" stroke-width="2">
    <rect x="530" y="102" width="80" height="80" rx="4"/>
    <rect x="530" y="322" width="80" height="80" rx="4"/>
  </g>
  <g stroke="#fff" stroke-width="1.5">
    <path d="M541.4 102v80M552.8 102v80M564.2 102v80M575.6 102v80M587 102v80M598.4 102v80M530 113.4h80M530 124.8h80M530 136.2h80M530 147.6h80M530 159h80M530 170.4h80"/>
    <path d="M541.4 322v80M552.8 322v80M564.2 322v80M575.6 322v80M587 322v80M598.4 322v80M530 333.4h80M530 344.8h80M530 356.2h80M530 367.6h80M530 379h80M530 390.4h80"/>
  </g>
  <text x="570" y="88" text-anchor="middle" font-size="13" fill="#7b8794">patch features</text>
  <text x="570" y="428" text-anchor="middle" font-size="13" fill="#7b8794">patch features</text>

  <path d="M616 142 C 660 142, 660 230, 700 240" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <path d="M616 362 C 660 362, 660 264, 700 254" stroke="#9aa5b1" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <!-- difference -->
  <circle cx="742" cy="247" r="40" fill="#fff" stroke="#1f2933" stroke-width="2"/>
  <text x="742" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">|Δ|</text>
  <text x="742" y="314" text-anchor="middle" font-size="13" fill="#7b8794">per-patch difference</text>

  <path d="M788 247 L838 247" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="842" y="207" width="120" height="80" rx="14" fill="#fff" stroke="#d9dee4"/>
  <text x="902" y="243" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2933">Head</text>
  <text x="902" y="266" text-anchor="middle" font-size="13" fill="#52606d">per patch</text>
  <path d="M968 247 L1012 247" stroke="#9aa5b1" stroke-width="2" marker-end="url(#a2)"/>

  <!-- output grid: illustrative pattern only -->
  <g stroke="#fff" stroke-width="2">
    <rect x="1016" y="187" width="120" height="120" rx="6" fill="#eef0f3"/>
    <rect x="1050" y="204" width="17" height="17" fill="#e4572e" opacity="0.85"/>
    <rect x="1067" y="204" width="17" height="17" fill="#e4572e" opacity="0.5"/>
    <rect x="1050" y="221" width="17" height="17" fill="#e4572e" opacity="0.6"/>
    <rect x="1084" y="255" width="17" height="17" fill="#e4572e" opacity="0.85"/>
    <rect x="1101" y="255" width="17" height="17" fill="#e4572e" opacity="0.45"/>
  </g>
  <g stroke="#fff" stroke-width="1.2">
    <path d="M1033 187v120M1050 187v120M1067 187v120M1084 187v120M1101 187v120M1118 187v120M1016 204h120M1016 221h120M1016 238h120M1016 255h120M1016 272h120M1016 289h120"/>
  </g>
  <text x="1076" y="172" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7b8794">DAMAGE GRID</text>
  <text x="1076" y="330" text-anchor="middle" font-size="13" fill="#7b8794">7 × 7 patches</text>
  <text x="1076" y="348" text-anchor="middle" font-size="13" fill="#7b8794">(32 px each)</text>

</svg>
